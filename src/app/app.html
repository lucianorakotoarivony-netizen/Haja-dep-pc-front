@if (auth.authLoading()) {
  <div class="auth-overlay">
    <div class="auth-overlay-content">
      <div class="spinner"></div>
      <p>{{ auth.authMessage() }}</p>
    </div>
  </div>
}
<div class="app-layout">
  <app-navbar></app-navbar>
  <main class="content">
    <router-outlet></router-outlet>
  </main>
  <app-footer></app-footer>
</div>
